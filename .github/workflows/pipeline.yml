name: CI/CD Pipeline to Hugging Face Hub

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install -U uv

      - name: Generate lockfile and install dependencies
        run: |
          # Isolate dependency compilation to avoid project context issues
          mkdir -p /tmp/deps
          cp requirements.txt requirements-dev.txt /tmp/deps/
          cd /tmp/deps
          # Generate a flat lock file for maximum compatibility
          uv pip compile requirements-dev.txt -o requirements.lock
          mv requirements.lock ${{ github.workspace }}
          cd ${{ github.workspace }}          
          # Sync dependencies using the uv-generated lock file for speed and consistency
          uv pip sync --system requirements.lock

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

  test-inference:
    name: Test Model Inference
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install -U uv

      - name: Generate lockfile and install dependencies
        run: |
          mkdir -p /tmp/deps
          cp requirements.txt /tmp/deps/
          cd /tmp/deps
          uv pip compile requirements.txt -o requirements.lock
          mv requirements.lock ${{ github.workspace }}
          cd ${{ github.workspace }}          
          uv pip sync --system requirements.lock

      - name: Run inference test
        run: PYTHONPATH=. python scripts/test_inference.py

  deploy-to-hub:
    name: Deploy model to Hugging Face Hub
    runs-on: ubuntu-latest
    needs: test-inference
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install git-lfs

      - name: Configure Git and LFS
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git lfs install

      - name: Install Hugging Face Hub library
        run: pip install huggingface-hub

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Se connecter au Hub en utilisant le token
          hf auth login
          
          # Pousse la branche actuelle (dev) vers la branche 'main' du Space.
          # L'option --force est souvent nécessaire pour les déploiements sur les Spaces.
          git push --force https://huggingface.co/spaces/dataChaser/agent-triage-hospitalier HEAD:main
