name: CI/CD Pipeline to Hugging Face Hub

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: pip install -U uv

      - name: Generate lockfile and install dependencies
        # Ce job est le seul à compiler le lockfile pour garantir la cohérence.
        # Il utilise requirements-dev.txt pour inclure tous les outils de qualité.
        run: |
          uv pip compile requirements-dev.txt -o requirements.lock
          uv pip sync --system requirements.lock
          # On stocke le lockfile pour les jobs suivants
          echo "LOCKFILE_PATH=${{ github.workspace }}/requirements.lock" >> $GITHUB_ENV

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: ${{ env.LOCKFILE_PATH }}

  test-inference:
    name: Test Model Inference
    runs-on: ubuntu-latest
    needs: quality-gate
    # Ce job ne compile pas, il utilise le lockfile du job précédent.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: pip install -U uv

      - name: Download lockfile artifact
        uses: actions/download-artifact@v4
        with:
          name: requirements-lock

      - name: Install dependencies from lockfile
        # Utilise le même lockfile pour garantir un environnement identique.
        run: uv pip sync --system requirements.lock

      - name: Run inference test
        run: PYTHONPATH=. python scripts/test_inference.py

  build-and-deploy-to-hub:
    name: Build and Deploy to Hugging Face Hub
    runs-on: ubuntu-latest
    needs: test-inference
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        # Cette action prépare un environnement de build Docker plus avancé
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        # Met en cache les couches Docker pour accélérer les builds futurs
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/Dockerfile', '**/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to the Hugging Face Docker Registry
        uses: docker/login-action@v3
        with:
          registry: huggingface.co
          username: ${{ secrets.HF_USERNAME }} # Votre nom d'utilisateur HF
          password: ${{ secrets.HF_TOKEN }}    # Un token avec droits d'écriture

      - name: Build and push Docker image to the Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Utilise le cache pour le build
          cache-from: type=local,src=/tmp/.buildx-cache
          # Met à jour le cache avec les nouvelles couches
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          tags: huggingface.co/spaces/dataChaser/agent-triage-hospitalier:latest

      - name: Move cache
        # Si le build a réussi, le nouveau cache remplace l'ancien
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
