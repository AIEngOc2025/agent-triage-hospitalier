name: CI/CD Pipeline to Hugging Face Hub

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: pip install -U uv

      - name: Generate lockfile and install dependencies
        # Ce job est le seul à compiler le lockfile pour garantir la cohérence.
        # Il utilise requirements-dev.txt pour inclure tous les outils de qualité.
        run: |
          uv pip compile requirements-dev.txt -o requirements.lock
          uv pip sync --system requirements.lock
          # On stocke le lockfile pour les jobs suivants
          echo "LOCKFILE_PATH=${{ github.workspace }}/requirements.lock" >> $GITHUB_ENV

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: ${{ env.LOCKFILE_PATH }}

  test-inference:
    name: Test Model Inference
    runs-on: ubuntu-latest
    needs: quality-gate
    # Ce job ne compile pas, il utilise le lockfile du job précédent.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
        # LFS n'est plus nécessaire ici car le modèle sera téléchargé

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: pip install -U uv

      - name: Download lockfile artifact
        uses: actions/download-artifact@v4
        with:
          name: requirements-lock

      - name: Install dependencies from lockfile
        # Utilise le même lockfile pour garantir un environnement identique.
        run: uv pip sync --system requirements.lock

      - name: Download Model from HF Bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Synchronise le contenu du bucket dans un dossier local 'model'
          hf-transfer download hf://buckets/dataChaser/agent-triage-hospitalier-storage ./model

      - name: Run inference test
        env:
          MODEL_PATH: ./model # Surcharge le chemin du modèle pour le test
        run: PYTHONPATH=. uv run python scripts/test_inference.py

      - name: Run full test suite
        run: PYTHONPATH=. uv run pytest tests/

  deploy-to-space:
    name: Deploy to Hugging Face Space
    runs-on: ubuntu-latest
    needs: test-inference
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour pousser vers une autre branche/repo
          lfs: true # Très important pour pousser les modèles
      
      - name: Push to Hugging Face Hub
        uses: huggingface-hub/push-to-hub@V0
        with:
          repo_id: dataChaser/agent-triage-hospitalier
          repo_type: space
          token: ${{ secrets.HF_TOKEN }} # Token classique avec droits d'écriture
          commit_message: "🚀 Deploy new version from GitHub Actions"
          # Exclut le dossier du modèle du push, car il sera dans le bucket
          allow_patterns: "app/*,scripts/*,tests/*,*.txt,*.md,*.lock,*.yml,Dockerfile"
