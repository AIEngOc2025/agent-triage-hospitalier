name: CI/CD Pipeline to Hugging Face Hub

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Generate lockfile and install dependencies
        run: |
          # Isolate dependency compilation to avoid project context issues
          mkdir -p /tmp/deps
          cp requirements.txt requirements-dev.txt /tmp/deps/
          cd /tmp/deps
          uv pip compile requirements-dev.txt -o uv.lock --output-format=toml
          mv uv.lock ${{ github.workspace }}
          cd ${{ github.workspace }}
          uv pip sync --system uv.lock

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

  test-inference:
    name: Test Model Inference
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Generate lockfile and install dependencies
        run: |
          mkdir -p /tmp/deps
          cp requirements.txt /tmp/deps/
          cd /tmp/deps          
          uv pip compile requirements.txt -o uv.lock --output-format=toml
          mv uv.lock ${{ github.workspace }}
          cd ${{ github.workspace }}
          uv pip sync --system uv.lock

      - name: Run inference test
        run: python scripts/test_inference.py

  deploy-to-hub:
    name: Deploy model to Hugging Face Hub
    runs-on: ubuntu-latest
    needs: test-inference
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        uses: huggingface/hub-action@v0.1.0
        with:
          repo_id: "dataChaser/agent-triage-hospitalier"
          token: ${{ secrets.HF_TOKEN }}
          commit_message: "Push model to Hub from GitHub Actions"
