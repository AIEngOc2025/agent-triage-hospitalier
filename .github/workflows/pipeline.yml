name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install -U uv

      - name: Generate lockfile and install dependencies
        run: |
          uv pip compile requirements-dev.txt -o requirements.lock
          uv pip sync --system requirements.lock
          echo "LOCKFILE_PATH=${{ github.workspace }}/requirements.lock" >> $GITHUB_ENV

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: ${{ env.LOCKFILE_PATH }}

  test-inference:
    name: Test Model Inference
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install -U uv

      - name: Download lockfile artifact
        uses: actions/download-artifact@v4
        with:
          name: requirements-lock

      - name: Install dependencies
        run: uv pip sync --system requirements.lock

      - name: Download Model from HF Bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf-transfer download hf://buckets/dataChaser/agent-triage-hospitalier-storage ./model

      - name: Run inference test
        env:
          MODEL_PATH: ./model
        run: PYTHONPATH=. uv run python scripts/test_inference.py

      - name: Run full test suite
        run: PYTHONPATH=. uv run pytest tests/

  deploy-to-gcp:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test-inference
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/414294705487/locations/global/workloadIdentityPools/agent-triage-gh/providers/github'
          service_account: 'github-actions-deployer@agent-hospitalier.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Build and Deploy
        run: |
          gcloud builds submit --config=cloudbuild.yml \
            --substitutions=PROJECT_ID=agent-hospitalier,COMMIT_SHA=$GITHUB_SHA

  deploy-to-space:
    name: Deploy to Hugging Face Space
    runs-on: ubuntu-latest
    needs: test-inference
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push' && secrets.HF_TOKEN != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hugging Face Hub
        uses: huggingface-hub/push-to-hub@V0
        with:
          repo_id: dataChaser/agent-triage-hospitalier
          repo_type: space
          token: ${{ secrets.HF_TOKEN }}
          commit_message: "🚀 Deploy new version from GitHub Actions"
          allow_patterns: "app/*,scripts/*,tests/*,*.txt,*.md,*.lock,*.yml,Dockerfile"
