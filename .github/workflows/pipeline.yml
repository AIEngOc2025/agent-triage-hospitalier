name: CI/CD Pipeline to Hugging Face Hub

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: pip install -U uv

      - name: Generate lockfile and install dependencies
        # Ce job est le seul à compiler le lockfile pour garantir la cohérence.
        # Il utilise requirements-dev.txt pour inclure tous les outils de qualité.
        run: |
          uv pip compile requirements-dev.txt -o requirements.lock
          uv pip sync --system requirements.lock
          # On stocke le lockfile pour les jobs suivants
          echo "LOCKFILE_PATH=${{ github.workspace }}/requirements.lock" >> $GITHUB_ENV

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: ${{ env.LOCKFILE_PATH }}

  test-inference:
    name: Test Model Inference
    runs-on: ubuntu-latest
    needs: quality-gate
    # Ce job ne compile pas, il utilise le lockfile du job précédent.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # LFS n'est plus nécessaire ici car le modèle sera téléchargé

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: pip install -U uv

      - name: Download lockfile artifact
        uses: actions/download-artifact@v4
        with:
          name: requirements-lock

      - name: Install dependencies from lockfile
        # Utilise le même lockfile pour garantir un environnement identique.
        run: uv pip sync --system requirements.lock

      - name: Download Model from HF Bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Synchronise le contenu du bucket dans un dossier local 'model'
          hf-transfer download hf://buckets/dataChaser/agent-triage-hospitalier-storage ./model

      - name: Run inference test
        env:
          MODEL_PATH: ./model # Surcharge le chemin du modèle pour le test
        run: PYTHONPATH=. uv run python scripts/test_inference.py

  deploy-to-gcp:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test-inference
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push' && secrets.GCP_SA_KEY != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Build and Deploy
        run: |
          gcloud builds submit --config=cloudbuild.yaml \
            --substitutions=PROJECT_ID=agent-hospitalier,COMMIT_SHA=$GITHUB_SHA
