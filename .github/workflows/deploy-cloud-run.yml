name: "CI/CD Pipeline - Test and Trigger Build"

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  test:
    name: "Quality Gate (CI)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v1
      - name: Sync dependencies
        run: |
          uv venv
          uv pip compile requirements-dev.txt -o requirements.lock
          uv pip sync requirements.lock
      - name: Run tests
        env:
          APP_TEST_MODE: "1"
        run: uv run python -m pytest tests/

  # Note: Actual build and deployment are now handled by Google Cloud Build,
  # which is connected directly to the GitHub repository.
  # This workflow ensures code quality before Cloud Build triggers.
