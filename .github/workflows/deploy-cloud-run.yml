name: "Deploy to Google Cloud Run"

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  # --- PHASE 1: VALIDATION ---
  test:
    name: "Quality Gate (CI)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and cache dependencies
        uses: astral-sh/setup-uv@v1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: |
          uv venv
          uv pip compile requirements-dev.txt -o requirements.lock
          uv pip sync requirements.lock

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Run tests with Pytest
        env:
          APP_TEST_MODE: "1"
        run: uv run python -m pytest

  # --- PHASE 2: DEPLOYMENT SUR GOOGLE CLOUD RUN ---
  deploy-to-cloud-run:
    name: "Deploy to Google Cloud Run"
    runs-on: ubuntu-latest
    needs: test
    if: (github.ref == 'refs/heads/dev' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: 'projects/414294705487/locations/global/workloadIdentityPools/agent-triage-gh/providers/github'
          impersonate_service_account: 'tri-svc-deployer@agent-hospitalier.iam.gserviceaccount.com'
          project_id: 'agent-hospitalier'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2.1.0'

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_URL=europe-west1-docker.pkg.dev/agent-hospitalier/cloud-run-source-deploy/agent-triage:$GITHUB_SHA
          docker build -f Dockerfile.cloudrun -t $IMAGE_URL .
          docker push $IMAGE_URL

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URL=europe-west1-docker.pkg.dev/agent-hospitalier/cloud-run-source-deploy/agent-triage:$GITHUB_SHA
          gcloud run deploy agent-triage-service \
            --image $IMAGE_URL \
            --platform managed \
            --region europe-west1 \
            --allow-unauthenticated \
            --startup-probe-path=/health \
            --startup-probe-port=8080
