name: "Deploy to Google Cloud Run"

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  test:
    name: "Quality Gate (CI)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v1
      - name: Sync dependencies
        run: |
          uv venv
          uv pip compile requirements-dev.txt -o requirements.lock
          uv pip sync requirements.lock
      - name: Run tests
        env:
          APP_TEST_MODE: "1"
        run: uv run python -m pytest

  deploy-to-cloud-run:
    name: "Deploy to Google Cloud Run"
    runs-on: ubuntu-latest
    needs: test
    if: (github.ref == 'refs/heads/dev' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: 'projects/414294705487/locations/global/workloadIdentityPools/agent-triage-gh/providers/github'
          service_account: 'tri-svc-deployer@agent-hospitalier.iam.gserviceaccount.com'
          project_id: 'agent-hospitalier'

      - name: Submit Cloud Build
        run: |
          gcloud builds submit --config=cloudbuild.yml \
            --substitutions=COMMIT_SHA=$GITHUB_SHA
