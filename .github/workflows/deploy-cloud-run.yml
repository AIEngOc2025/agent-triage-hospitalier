name: "Deploy to Google Cloud Run"

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  # --- PHASE 1: VALIDATION ---
  test:
    name: "Quality Gate (CI)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and cache dependencies
        uses: astral-sh/setup-uv@v1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: |
          uv venv
          uv pip compile requirements-dev.txt -o requirements.lock
          uv pip sync requirements.lock

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Run tests with Pytest
        env:
          APP_TEST_MODE: "1"
        run: uv run python -m pytest

  # --- PHASE 2: BUILD, PUSH & DEPLOY SUR GOOGLE CLOUD RUN ---
  deploy-to-cloud-run:
    name: "Build & Deploy to Cloud Run via Cloud Build"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true # Nécessaire pour les fichiers de config Docker/scripts si besoin, mais le modèle est dans GCS

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/agent-hospitalier/locations/global/workloadIdentityPools/agent-triage-gh/providers/github'
          service_account: 'tri-svc-deployer@agent-hospitalier.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Submit Cloud Build and Deploy
        run: |
          gcloud builds submit --config=cloudbuild.yml \
            --substitutions=PROJECT_ID=agent-hospitalier,COMMIT_SHA=$GITHUB_SHA
