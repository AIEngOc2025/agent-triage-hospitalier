steps:
  # 1. Construction de l'image de production
  #    On utilise le Dockerfile.prod qui se base sur l'image vllm/vllm-openai
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Production Image'
    args: ['build', '-f', 'Dockerfile.prod', '-t', 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/agent-triage:${COMMIT_SHA}', '.']

  # 2. Push de l'image vers Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Docker Image'
    args: ['push', 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/agent-triage:${COMMIT_SHA}']

  # 3. Déploiement sur Cloud Run
  #    On met à jour le service en passant le chemin du modèle GCS via une variable d'environnement.
  #    Le script start.sh dans le conteneur utilisera cette variable.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy to Cloud Run'
    entrypoint: 'gcloud'
    args:
      [
        'run', 'deploy', 'agent-triage-hospitalier',
        '--image', 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/agent-triage:${COMMIT_SHA}',
        '--region', 'europe-west1',
        '--allow-unauthenticated',
        '--set-env-vars', 'MODEL_ID=gs://modeles-triage-hospitalier/merged_dpo_final_chsa',
        '--set-env-vars', 'PORT=8080',
        '--cpu', '4',
        '--memory', '16Gi',
        '--gpu', '1',
        '--gpu-type', 'nvidia-l4',
        '--timeout', '2400s',
        #'--startup-probe', 'tcp',
        #'--startup-probe-timeout', '600'
      ]

images:
  - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/agent-triage:${COMMIT_SHA}'

options:
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET
