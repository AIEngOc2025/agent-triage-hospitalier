steps:
  # 1. Construction de l'image de production
  #    On utilise le Dockerfile.prod qui se base sur l'image python:3.11-slim
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Production Image'
    args: ['build', '-f', 'Dockerfile.prod', '-t', 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/agent-triage:latest', '.']

  # 2. Push de l'image vers Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Docker Image'
    args: ['push', 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/agent-triage:latest']

  # 3. Déploiement sur Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy to Cloud Run'
    entrypoint: 'gcloud'
    args:
      [
        'run', 'deploy', 'agent-triage-hospitalier',
        '--image', 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/agent-triage:latest',
        '--region', 'europe-west1',
        '--allow-unauthenticated',
        '--set-env-vars', 'MODEL_PATH=gs://modeles-triage-hospitalier/merged_dpo_final_chsa,INFERENCE_SERVICE_URL=http://localhost:8000,APP_ENV=production',
        '--cpu', '4',
        '--memory', '16Gi',
        '--gpu', '1',
        '--gpu-type', 'nvidia-l4',
        '--timeout', '2400s',
        '--cpu-boost',
        '--no-cpu-throttling'
      ]

images:
  - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/agent-triage:latest'

options:
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET
