[project]
name = "agent-triage-hospitalier"
version = "0.1.0"
description = "A hospital triage agent using LLMs."
requires-python = ">=3.12,<3.14"
dependencies = [
    "requests>=2.34.2",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "pydantic-settings>=2.14.2",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.364",
    "spacy>=3.8.14",
    "pandas>=2.3.3",
    "httpx>=0.28.1",
    "aiofiles>=24.1.0",
    "datasets>=2.19.0",
    "peft>=0.20.0",
    "langdetect>=1.0.9",
    "streamlit>=1.61.1",
    "instructor>=1.15.4",
    "transformers>=5.14.1",
    "torch>=2.13.0",
    "vllm-metal>=0.1.0",
]

[tool.ruff]
line-length = 88
exclude = ["build", "*.jsonl"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "black>=24.0.0",
]
