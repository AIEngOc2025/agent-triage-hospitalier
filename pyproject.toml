[project]
name = "agent-triage-hospitalier"
version = "0.1.0"
description = "A hospital triage agent using LLMs."
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.0.0,<6.0.0",
    "requests>=2.34.2",
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "transformers",
    "mlx-lm",
    "presidio-analyzer",
    "presidio-anonymizer",
    "spacy",
]

[tool.ruff]
line-length = 88
exclude = ["build", "*.jsonl"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
