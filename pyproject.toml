[project]
name = "agent-triage-hospitalier"
version = "0.1.0"
description = "A hospital triage agent using LLMs."
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.50.0,<6.0.0",
    "requests>=2.34.2",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "pydantic-settings>=2.14.2",
    "transformers[torch]>=5.14.1",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.364",
    "spacy>=3.8.14",
    "pandas>=2.3.3",
    "httpx>=0.28.1",
    "aiofiles>=24.1.0",
    "lm-format-enforcer>=0.10.0",
    "vllm>=0.4.0; sys_platform != 'darwin'",
    "supervisor>=4.2.5",
    "google-cloud-storage>=2.10.0",
]

[tool.ruff]
line-length = 88
exclude = ["build", "*.jsonl"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "black>=24.0.0",
]
