steps:
  # 4. Construire l'image de l'API Gateway
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build API Image'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/agent-api-gateway', '.', '-f', 'Dockerfile.api']

  # 5. Pousser l'image de l'API
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push API Image'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/agent-api-gateway']

  # 6. Déployer l'API Gateway en mode PUBLIC et la connecter à l'inférence
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy API Service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agent-api-gateway'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/agent-api-gateway'
      - '--region=europe-west1'
      - '--ingress=all'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=414294705487-compute@developer.gserviceaccount.com'
      - '--set-env-vars=INFERENCE_SERVICE_URL=https://agent-inference-service-rlgcjqsysq-ew.a.run.app,MODEL_PATH=/app/models/merged_dpo_final_chsa'

  # 8. Construire l'image de l'interface utilisateur (Streamlit)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build UI Image'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/agent-ui', '.', '-f', 'Dockerfile.streamlit']

  # 9. Pousser l'image de l'UI
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push UI Image'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/agent-ui']

  # 10. Déployer l'UI sur Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy UI Service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agent-ui'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/agent-ui'
      - '--region=europe-west1'
      - '--ingress=all'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=API_BASE_URL=https://agent-api-gateway-414294705487.europe-west1.run.app'
options:
  logging: CLOUD_LOGGING_ONLY
